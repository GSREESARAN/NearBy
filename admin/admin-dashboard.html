<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NearBy — Admin Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      background: #111;
      border-bottom: 1px solid #222;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar h1 {
      color: #22c55e;
      font-size: 1.4rem;
      font-weight: 800;
    }

    .navbar p {
      color: #666;
      font-size: 0.8rem;
    }

    .logout-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .logout-btn:hover {
      border-color: #ef4444;
      color: #ef4444;
    }

    /* Main */
    .main {
      padding: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 2rem;
      font-weight: 800;
      color: #22c55e;
    }

    .stat-card .label {
      color: #666;
      font-size: 0.8rem;
      margin-top: 4px;
    }

    /* Orders section */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-header h2 {
      font-size: 1.1rem;
      color: #fff;
    }

    .refresh-btn {
      padding: 8px 16px;
      background: #22c55e;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s;
    }

    .refresh-btn:hover {
      background: #16a34a;
    }

    /* Filter tabs */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid #333;
      background: transparent;
      color: #aaa;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: #22c55e;
      border-color: #22c55e;
      color: #000;
      font-weight: 600;
    }

    /* Order cards */
    .orders-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .order-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 20px;
      transition: border 0.3s;
    }

    .order-card:hover {
      border-color: #333;
    }

    .order-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .order-id {
      color: #666;
      font-size: 0.8rem;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-pending {
      background: #422006;
      color: #fb923c;
    }

    .status-confirmed {
      background: #052e16;
      color: #22c55e;
    }

    .status-delivered {
      background: #1e3a5f;
      color: #60a5fa;
    }

    .order-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .detail-item {
      font-size: 0.9rem;
    }

    .detail-item span {
      color: #666;
    }

    .detail-item p {
      color: #fff;
      margin-top: 2px;
    }

    .detail-full {
      grid-column: 1 / -1;
      font-size: 0.9rem;
    }

    .detail-full span {
      color: #666;
    }

    .detail-full p {
      color: #fff;
      margin-top: 2px;
    }

    .order-time {
      color: #555;
      font-size: 0.78rem;
      margin-bottom: 14px;
    }

    /* Action buttons */
    .order-actions {
      display: flex;
      gap: 10px;
    }

    .action-btn {
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-confirm {
      background: #22c55e;
      color: #000;
    }

    .btn-confirm:hover {
      background: #16a34a;
    }

    .btn-delivered {
      background: #3b82f6;
      color: #fff;
    }

    .btn-delivered:hover {
      background: #2563eb;
    }

    .btn-disabled {
      background: #1a1a1a;
      color: #444;
      cursor: not-allowed;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #444;
    }

    .empty-state p {
      font-size: 1.1rem;
      margin-top: 12px;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .order-details {
        grid-template-columns: 1fr;
      }

      .detail-full {
        grid-column: 1;
      }
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div>
      <h1>🛵 NearBy</h1>
      <p>Admin Dashboard</p>
    </div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <!-- Main -->
  <div class="main">

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="number" id="total-count">-</div>
        <div class="label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="number" id="pending-count">-</div>
        <div class="label">Pending</div>
      </div>
      <div class="stat-card">
        <div class="number" id="confirmed-count">-</div>
        <div class="label">Confirmed</div>
      </div>
      <div class="stat-card">
        <div class="number" id="delivered-count">-</div>
        <div class="label">Delivered</div>
      </div>
    </div>

    <!-- Orders -->
    <div class="section-header">
      <h2>📋 Orders</h2>
      <button class="refresh-btn" onclick="loadOrders()">🔄 Refresh</button>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button class="filter-btn active" onclick="filterOrders('all', this)">All</button>
      <button class="filter-btn" onclick="filterOrders('pending', this)">🟠 Pending</button>
      <button class="filter-btn" onclick="filterOrders('confirmed', this)">🟢 Confirmed</button>
      <button class="filter-btn" onclick="filterOrders('delivered', this)">🔵 Delivered</button>
    </div>

    <!-- Orders List -->
    <div class="orders-list" id="orders-list">
      <div class="loading">Loading orders...</div>
    </div>

  </div>

  <script>
    const API = 'https://nearby-backend-pkni.onrender.com';
    let allOrders = [];
    let currentFilter = 'all';

    // Check auth on page load
    async function checkAuth() {
      const token = localStorage.getItem('nearby_token');
      if (!token) {
        window.location.href = 'admin-login.html';
        return;
      }

      try {
        const res = await fetch(`${API}/api/auth/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });
        const data = await res.json();
        if (!data.success) {
          localStorage.removeItem('nearby_token');
          window.location.href = 'admin-login.html';
        }
      } catch (err) {
        console.error('Auth check failed:', err);
      }
    }

    // Load all orders
    async function loadOrders() {
      try {
        const res = await fetch(`${API}/api/orders`);
        const data = await res.json();

        if (data.success) {
          allOrders = data.orders;
          updateStats();
          renderOrders(currentFilter);
        }
      } catch (err) {
        document.getElementById('orders-list').innerHTML =
          '<div class="empty-state">❌ <p>Could not load orders. Is backend running?</p></div>';
      }
    }

    // Update stats
    function updateStats() {
      document.getElementById('total-count').textContent = allOrders.length;
      document.getElementById('pending-count').textContent =
        allOrders.filter(o => o.status === 'pending').length;
      document.getElementById('confirmed-count').textContent =
        allOrders.filter(o => o.status === 'confirmed').length;
      document.getElementById('delivered-count').textContent =
        allOrders.filter(o => o.status === 'delivered').length;
    }

    // Filter orders
    function filterOrders(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderOrders(filter);
    }

    // Render orders
    function renderOrders(filter) {
      const list = document.getElementById('orders-list');
      const filtered = filter === 'all'
        ? allOrders
        : allOrders.filter(o => o.status === filter);

      if (filtered.length === 0) {
        list.innerHTML = '<div class="empty-state">📭 <p>No orders found</p></div>';
        return;
      }

      list.innerHTML = filtered.map(order => `
      <div class="order-card" id="card-${order.id}">
        <div class="order-header">
          <span class="order-id">Order #${String(order.id).padStart(4, '0')}</span>
          <span class="status-badge status-${order.status}">${order.status.toUpperCase()}</span>
        </div>

        <div class="order-details">
          <div class="detail-item">
            <span>👤 Name</span>
            <p>${order.name}</p>
          </div>
          <div class="detail-item">
            <span>📞 Phone</span>
            <p>${order.phone}</p>
          </div>
          <div class="detail-item">
            <span>🏪 Shop</span>
            <p>${order.shop}</p>
          </div>
          <div class="detail-full">
            <span>📦 Items</span>
            <p>${order.items}</p>
          </div>
          <div class="detail-full">
            <span>📍 Address</span>
            <p>${order.address}</p>
          </div>
        </div>

        <div class="order-time">
          🕐 ${new Date(order.created_at).toLocaleString('en-IN')}
        </div>

        <div class="order-actions">
          ${order.status === 'pending' ? `
            <button class="action-btn btn-confirm" onclick="confirmOrder('${order.id}')">
              ✅ Confirm Order
            </button>
          ` : ''}
          ${order.status === 'confirmed' ? `
            <button class="action-btn btn-delivered" onclick="markDelivered('${order.id}')">
              🛵 Mark Delivered
            </button>
          ` : ''}
          ${order.status === 'delivered' ? `
            <button class="action-btn btn-disabled" disabled>
              ✅ Delivered
            </button>
          ` : ''}
        </div>
      </div>
    `).join('');
    }

    // Confirm order
    async function confirmOrder(id) {
      try {
        const res = await fetch(`${API}/api/orders/${id}/confirm`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          await loadOrders();
        }
      } catch (err) {
        alert('Failed to confirm order. Try again.');
      }
    }

    // Mark delivered
    async function markDelivered(id) {
      try {
        const res = await fetch(`${API}/api/orders/${id}/delivered`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (data.success) {
          await loadOrders();
        }
      } catch (err) {
        alert('Failed to update order. Try again.');
      }
    }

    // Logout
    function logout() {
      localStorage.removeItem('nearby_token');
      window.location.href = 'admin-login.html';
    }

    // Init
    window.addEventListener('load', async () => {
      await checkAuth();
      await loadOrders();
    });

    // Auto refresh every 30 seconds
    setInterval(loadOrders, 30000);
  </script>

</body>

</html>
